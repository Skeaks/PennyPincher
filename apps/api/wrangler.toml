# PennyPincher ingest API (S07). All non-secret config lives here so a fresh clone deploys
# correctly (CONTRIBUTING.md). Secrets (the pilot bearer token, S08) are set with
# `wrangler secret put` and never appear in this file.
#
# The staging and production database_id values are the D1 identifiers Jamie created in the
# Cloudflare dashboard. They are identifiers, not secrets. Local `wrangler dev` runs D1
# in-process under .wrangler/ (gitignored) and never contacts Cloudflare, so the top-level id
# is only a label.

name = "pennypincher-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[observability]
enabled = true

# Local dev: `pnpm --filter api dev` applies migrations to the local D1, then serves.
[[d1_databases]]
binding = "DB"
database_name = "pennypincher-dev"
database_id = "local-dev"
migrations_dir = "migrations"

[env.staging]
name = "pennypincher-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pennypincher-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.production]
name = "pennypincher-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "pennypincher-production"
database_id = "93e9cd66-02be-433b-b77d-5dabca1069ec"
migrations_dir = "migrations"
