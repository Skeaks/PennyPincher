# Nightly: the slow checks that must NOT sit on the PR gate (CONTRIBUTING.md, "What the gate
# checks"). Runs the full gate on main once a day plus, over time, mutation testing (S10) and E2E
# against recorded fixtures. Never blocks a merge: on failure it opens (or updates) an issue.
#
# Agents cannot edit this file: see .github/CODEOWNERS and CLAUDE.md rule 4.
name: nightly

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily
  workflow_dispatch: # run by hand to check the job itself

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  slow-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: gate
        run: pnpm gate

      # - name: mutation testing (S10)
      #   # Stryker over packages/stats and packages/schema. Report the score; fail below the floor
      #   # set in S10's brief.
      #   run: pnpm --filter @pennypincher/stats mutation

      # - name: e2e against recorded fixtures (S05+)
      #   # Load the unpacked extension in headless Chromium against fixtures/ (never a live
      #   # retailer site) and assert that each adapter emits valid observations.
      #   run: pnpm --filter @pennypincher/extension e2e

      - name: open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "nightly failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const line = `- ${new Date().toISOString()}: [run ${context.runId}](${runUrl}) on \`${context.sha.slice(0, 7)}\``;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly",
              per_page: 10,
            });
            const existing = open.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: line,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["nightly"],
                body: [
                  "The nightly slow-check job failed. It never blocks a merge; someone should look.",
                  "",
                  line,
                ].join("\n"),
              });
            }
